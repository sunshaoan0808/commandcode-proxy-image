name: build-commandcode

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout private source
        uses: actions/checkout@v4
        with:
          repository: sunshaoan0808/commandcode-proxy
          ref: release
          token: ${{ secrets.GH_PAT }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/sunshaoan0808/commandcode-proxy:latest
            ghcr.io/sunshaoan0808/commandcode-proxy:${{ github.run_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
